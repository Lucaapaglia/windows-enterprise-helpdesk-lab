<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="title desc">
  <title id="title">Windows helpdesk lab network</title>
  <desc id="desc">On the isolated VirtualBox network LAB-NET, the Windows 11 workstation LAB-PC01 at 10.10.10.20 uses the Windows Server 2025 domain controller LAB-DC01 at 10.10.10.10 for DNS, authentication, Group Policy and file sharing.</desc>
  <style>
    text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
    .domain { font-size: 28px; font-weight: 700; fill: #f8fafc; }
    .network { font-size: 15px; fill: #c6d5e5; }
    .platform { font-size: 15px; font-weight: 600; fill: #36536a; }
    .host { font-size: 27px; font-weight: 700; fill: #132a3a; }
    .ip { font: 17px "DejaVu Sans Mono", Consolas, monospace; fill: #244c5b; }
    .detail { font-size: 15px; fill: #2d4352; }
    .link { font: 600 15px "DejaVu Sans Mono", Consolas, monospace; fill: #b7eee1; }
  </style>

  <rect width="880" height="290" rx="14" fill="#142b3d"/>
  <text x="26" y="43" class="domain">corp.lucalab.test</text>
  <text x="27" y="69" class="network">VirtualBox internal network · 10.10.10.0/24</text>

  <g transform="translate(26 95)">
    <rect width="323" height="169" rx="10" fill="#f5f9fc"/>
    <text x="19" y="32" class="platform">Windows 11 Enterprise</text>
    <text x="18" y="66" class="host">LAB-PC01</text>
    <text x="19" y="93" class="ip">10.10.10.20</text>
    <path d="M19 107 H304" stroke="#c6d5df"/>
    <text x="19" y="131" class="detail">Domain-joined workstation</text>
    <text x="19" y="153" class="detail">Client DNS set to 10.10.10.10</text>
  </g>

  <g>
    <path d="M349 180 H531" fill="none" stroke="#84d9c6" stroke-width="3"/>
    <circle cx="349" cy="180" r="5" fill="#84d9c6"/>
    <circle cx="531" cy="180" r="5" fill="#84d9c6"/>
    <text x="440" y="165" text-anchor="middle" class="link">LAB-NET</text>
  </g>

  <g transform="translate(531 95)">
    <rect width="323" height="169" rx="10" fill="#edf9f5"/>
    <text x="19" y="32" class="platform">Windows Server 2025</text>
    <text x="18" y="66" class="host">LAB-DC01</text>
    <text x="19" y="93" class="ip">10.10.10.10</text>
    <path d="M19 107 H304" stroke="#b9d8ce"/>
    <text x="19" y="131" class="detail">Active Directory and DNS</text>
    <text x="19" y="153" class="detail">Group Policy and SMB shares</text>
  </g>
</svg>

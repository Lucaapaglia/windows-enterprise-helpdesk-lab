<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="499" viewBox="0 0 1500 499"><rect width="100%" height="100%" fill="#0c0c0c"/><rect width="100%" height="54" fill="#202020"/><text x="22" y="35" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="22" font-weight="700">LAB-PC01 — DNS restored state</text><text x="24" y="88" fill="#facc15" font-family="Consolas,monospace" font-size="19">Get-DnsClientServerAddress -InterfaceAlias Ethernet -AddressFamily IPv4</text><text x="24" y="116" fill="#86efac" font-family="Consolas,monospace" font-size="19">Ethernet    {10.10.10.10}</text><text x="24" y="144" fill="#e5e7eb" font-family="Consolas,monospace" font-size="19"></text><text x="24" y="172" fill="#facc15" font-family="Consolas,monospace" font-size="19">Resolve-DnsName LAB-DC01.corp.lucalab.test</text><text x="24" y="200" fill="#86efac" font-family="Consolas,monospace" font-size="19">LAB-DC01.corp.lucalab.test    10.10.10.10</text><text x="24" y="228" fill="#e5e7eb" font-family="Consolas,monospace" font-size="19"></text><text x="24" y="256" fill="#facc15" font-family="Consolas,monospace" font-size="19">gpupdate /force</text><text x="24" y="284" fill="#86efac" font-family="Consolas,monospace" font-size="19">Computer Policy update has completed successfully.</text><text x="24" y="312" fill="#86efac" font-family="Consolas,monospace" font-size="19">User Policy update has completed successfully.</text><text x="24" y="340" fill="#e5e7eb" font-family="Consolas,monospace" font-size="19"></text><text x="24" y="368" fill="#facc15" font-family="Consolas,monospace" font-size="19">Test-ComputerSecureChannel -Verbose</text><text x="24" y="396" fill="#86efac" font-family="Consolas,monospace" font-size="19">True</text><text x="24" y="424" fill="#86efac" font-family="Consolas,monospace" font-size="19">The secure channel between the local computer and the domain corp.lucalab.test is in good condition.</text></svg>